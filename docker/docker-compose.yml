services:
  neuraid:
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        BRANCH: DePIN-Test
        # Pinned so rebuilds are reproducible; it must match NEURAI_EXPECTED_GENESIS below.
        SOURCE_COMMIT: "${NODE_SOURCE_COMMIT:-e64965d7311ff51d0f3a9a3a48d8e75992122b5c}"
    container_name: neurai-testnet-node
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # ── Network ──────────────────────────────────────────────────────────
      NEURAI_TESTNET: "1"
      # NEURAI_LISTEN: 1 to accept inbound P2P connections
      NEURAI_LISTEN: "0"
      NEURAI_REST: "1"

      # ── RPC ──────────────────────────────────────────────────────────────
      # User/password come from .env (copy .env.example) and are shared with
      # the rpc-proxy, so both always agree.
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # Any IP may connect, but the RPC port is only published on the host's
      # loopback (see ports): only the proxy and the host itself reach it.
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "19101"
      NEURAI_RPC_TIMEOUT: "240"
      NEURAI_RPC_WORKQUEUE: "64"
      NEURAI_RPC_THREADS: "8"

      # ── Wallet ───────────────────────────────────────────────────────────
      # NEURAI_DISABLE_WALLET: 1=disabled | 0=enabled
      NEURAI_DISABLE_WALLET: "1"

      # ── Indexes ──────────────────────────────────────────────────────────
      NEURAI_TXINDEX: "1"
      NEURAI_ASSETINDEX: "1"
      NEURAI_ADDRESSINDEX: "1"
      NEURAI_TIMESTAMPINDEX: "1"
      NEURAI_SPENTINDEX: "1"
      NEURAI_PUBKEYINDEX: "1"

      # ── Data ─────────────────────────────────────────────────────────────
      NEURAI_DATADIR: "/data"

    volumes:
      - neurai_data:/data

    ports:
      - "19100:19100"   # testnet P2P
      # Loopback only: Docker bypasses host firewalls such as ufw, so
      # publishing it on 0.0.0.0 would open the full node RPC to the internet.
      - "127.0.0.1:19101:19101"   # testnet RPC

    networks:
      - neurai_net

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  rpc-proxy:
    build:
      context: ./rpc-proxy
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/NeuraiProject/neurai-rpc-proxy.git
        # Pinned commit; bump it to update the proxy (a branch would stay cached).
        REPO_REF: "${PROXY_SOURCE_COMMIT:-423a177dd62fcb7f5e2f4f2d1de8168eabe79110}"
    container_name: neurai-testnet-rpc-proxy
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      PROXY_CONCURRENCY: "4"
      PROXY_ENVIRONMENT: "Neurai Testnet"
      PROXY_ENDPOINT: "http://rpc-proxy:19999/rpc"
      PROXY_LOCAL_PORT: "19999"
      # Testnet genesis of the DePIN-Test branch; the proxy refuses to start without it.
      NEURAI_EXPECTED_GENESIS: "0000008b384aeffecdab182575dc4e86c9f07f90318c65088532660ed9a8a021"
      NEURAI_NODE_NAME: "neuraid-testnet"
      NEURAI_NODE_URL: "http://neuraid:19101"
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"

    expose:
      - "19999"

    ports:
      - "19999:19999"

    networks:
      - neurai_net

    depends_on:
      neuraid:
        condition: service_healthy

  explorer:
    build:
      # Built from this checkout, so local changes are what runs.
      context: ..
      dockerfile: docker/explorer-rpc/Dockerfile
    container_name: neurai-testnet-explorer
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      EXPLORER_BASE_CURRENCY: "XNA"
      EXPLORER_NEURAI_URL: "http://rpc-proxy:19999/rpc"
      EXPLORER_NEURAI_USERNAME: "anonymous"
      EXPLORER_NEURAI_PASSWORD: "anonymous"
      EXPLORER_HTTP_PORT: "8888"
      EXPLORER_HEADLINE: "Neurai Testnet"
      EXPLORER_THEME: "light"
      EXPLORER_IPFS_GATEWAY: "https://ipfs.io/ipfs/"
      EXPLORER_PRICE_LOOKUP_ENABLED: "false"

    expose:
      - "8888"

    ports:
      - "8888:8888"

    networks:
      - neurai_net

    depends_on:
      - rpc-proxy

volumes:
  neurai_data:
    driver: local

networks:
  neurai_net:
    driver: bridge
