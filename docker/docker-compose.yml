services:
  neuraid:
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        BRANCH: DePIN-Test
        # Pinned so rebuilds are reproducible; it must match NEURAI_EXPECTED_GENESIS below.
        SOURCE_COMMIT: "${NODE_SOURCE_COMMIT:-a9f7ca593a8d5121d6bb07bbb55670ae5a6a09e3}"
    container_name: neurai-testnet-node
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # ── Network ──────────────────────────────────────────────────────────
      NEURAI_TESTNET: "1"
      # NEURAI_LISTEN: 1 to accept inbound P2P connections
      NEURAI_LISTEN: "0"
      NEURAI_REST: "1"

      # ── RPC ──────────────────────────────────────────────────────────────
      # User/password come from .env (copy .env.example) and are shared with
      # wallet-services, so both always agree.
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # Any IP may connect, but the RPC port is only published on the host's
      # loopback (see ports): only wallet-services and the host itself reach it.
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "19101"
      NEURAI_RPC_TIMEOUT: "240"
      NEURAI_RPC_WORKQUEUE: "64"
      NEURAI_RPC_THREADS: "8"

      # ── Wallet ───────────────────────────────────────────────────────────
      # NEURAI_DISABLE_WALLET: 1=disabled | 0=enabled
      NEURAI_DISABLE_WALLET: "1"

      # ── Indexes ──────────────────────────────────────────────────────────
      NEURAI_TXINDEX: "1"
      NEURAI_ASSETINDEX: "1"
      NEURAI_ADDRESSINDEX: "1"
      NEURAI_TIMESTAMPINDEX: "1"
      NEURAI_SPENTINDEX: "1"
      NEURAI_PUBKEYINDEX: "1"

      # ── Data ─────────────────────────────────────────────────────────────
      NEURAI_DATADIR: "/data"

    volumes:
      - neurai_data:/data

    ports:
      - "19100:19100"   # testnet P2P
      # Loopback only: Docker bypasses host firewalls such as ufw, so
      # publishing it on 0.0.0.0 would open the full node RPC to the internet.
      - "127.0.0.1:19101:19101"   # testnet RPC

    networks:
      - neurai_net

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  wallet-services:
    build:
      # The HTTP API of NeuraiProject/neurai-wallet-services, built straight
      # from GitHub with its own Dockerfile at a pinned commit; bump it to
      # update (a branch would stay cached).
      context: "https://github.com/NeuraiProject/neurai-wallet-services.git#${WALLET_SERVICES_SOURCE_COMMIT:-0c06987e3a07653a62c5f76ae941e2e6e0291199}"
      dockerfile: docker/wallet-services/Dockerfile
    container_name: neurai-testnet-wallet-services
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # HTTP API only (POST /rpc): no /push WebSocket, so no auth token or ZMQ.
      PROXY_WSS_ENABLED: "false"
      PROXY_HTTP_ENABLED: "true"
      # The listener port, with or without WebSocket. TLS stays off: only the
      # explorer and the host's loopback reach it.
      PROXY_WSS_PORT: "19999"
      PROXY_WSS_TLS_ENABLED: "false"
      PROXY_SERVICE_ID: "neurai-explorer-testnet"
      PROXY_HTTP_ENVIRONMENT: "Neurai Testnet"
      # Testnet genesis of the DePIN-Test branch: a node on another chain is
      # never used.
      NEURAI_NETWORK: "testnet"
      NEURAI_EXPECTED_GENESIS: "0000008b384aeffecdab182575dc4e86c9f07f90318c65088532660ed9a8a021"
      NEURAI_NODE_NAME: "neuraid-testnet"
      NEURAI_NODE_URL: "http://neuraid:19101"
      NEURAI_RPC_USER: "${NODE_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NODE_RPC_PASSWORD:-changeme}"
      # The explorer is a trusted client, recognised by the key it sends as
      # its RPC password: its own request budget instead of the per-IP one,
      # and gettxoutsetinfo (coins in circulation), which scans the whole UTXO
      # set and is left out of the public whitelist. Answered at most once per
      # block (cached), however many pages ask.
      PROXY_HTTP_CLIENTS: '[{"name":"explorer","key":"${EXPLORER_RPC_KEY:-change-this-explorer-key}","extra_methods":["gettxoutsetinfo"]}]'

    expose:
      - "19999"

    ports:
      # Loopback only: the explorer reaches it over neurai_net. Publish it as
      # "19999:19999" to offer a public RPC (other clients get the per-IP
      # limits and the public whitelist).
      - "127.0.0.1:19999:19999"

    networks:
      - neurai_net

    depends_on:
      neuraid:
        condition: service_healthy

  explorer:
    build:
      # Built from this checkout, so local changes are what runs.
      context: ..
      dockerfile: docker/explorer-rpc/Dockerfile
    container_name: neurai-testnet-explorer
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      EXPLORER_BASE_CURRENCY: "XNA"
      EXPLORER_NEURAI_URL: "http://wallet-services:19999/rpc"
      # The password is the explorer's key in wallet-services (PROXY_HTTP_CLIENTS).
      EXPLORER_NEURAI_USERNAME: "explorer"
      EXPLORER_NEURAI_PASSWORD: "${EXPLORER_RPC_KEY:-change-this-explorer-key}"
      EXPLORER_HTTP_PORT: "8888"
      EXPLORER_HEADLINE: "Neurai Testnet"
      EXPLORER_THEME: "light"
      EXPLORER_IPFS_GATEWAY: "https://ipfs.io/ipfs/"
      EXPLORER_PRICE_LOOKUP_ENABLED: "false"

    expose:
      - "8888"

    ports:
      - "8888:8888"

    networks:
      - neurai_net

    depends_on:
      - wallet-services

volumes:
  neurai_data:
    driver: local

networks:
  neurai_net:
    driver: bridge
